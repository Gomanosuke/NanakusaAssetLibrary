name: Core tests
on: [push, pull_request]
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_core.py -v
      - run: python -m unittest discover -s tests -p test_storage.py -v
      - run: python -m unittest discover -s tests -p test_organize.py -v
      - run: python -m unittest discover -s tests -p test_pbr.py -v
      - run: python -m unittest discover -s tests -p test_embedded.py -v
